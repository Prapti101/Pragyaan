[server]
# Serves app/static/ (bundled fonts and logo) so the theme works offline.
enableStaticServing = true
maxUploadSize = 25

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
# PRAGYAAN "Ink & Signal": warm ivory paper, deep ink, electric cobalt, acid lime and vivid coral.
# Editorial type (Bricolage Grotesque headlines, Instrument Sans text), thick ink edges with hard shadows.
# The full component styling lives in app/ui.py; these values set Streamlit's own widgets to match.
base = "light"
primaryColor = "#2340FF"
backgroundColor = "#F4EEE1"
secondaryBackgroundColor = "#EBE3D1"
textColor = "#0A0C1B"
borderColor = "#0A0C1B"
showWidgetBorder = true
linkColor = "#2340FF"
linkUnderline = true
baseRadius = "10px"
buttonRadius = "10px"
font = "Instrument Sans, system-ui, sans-serif"
headingFont = "Bricolage Grotesque, Instrument Sans, system-ui, sans-serif"
headingFontWeights = [800, 750, 700, 700, 700, 700]
headingFontSizes = ["3rem", "2rem", "1.45rem", "1.2rem", "1.08rem", "1rem"]
codeFont = "IBM Plex Mono, monospace"
codeBackgroundColor = "#EBE3D1"
codeTextColor = "#0A0C1B"
baseFontSize = 15
dataframeHeaderBackgroundColor = "#EBE3D1"
dataframeBorderColor = "#CFC5AE"
chartCategoricalColors = ["#2340FF", "#FF5C47", "#0A0C1B", "#8FA60F", "#7C8BFF", "#C2410C", "#5B5E70", "#B8E62E"]
redColor = "#E8432E"
redBackgroundColor = "#FFE1DC"
redTextColor = "#8A1C0E"
greenColor = "#4D7A00"
greenBackgroundColor = "#EEFFB8"
greenTextColor = "#2F4A00"
blueColor = "#2340FF"
blueBackgroundColor = "#E1E6FF"
blueTextColor = "#1A2FC0"
orangeColor = "#D9480F"
orangeBackgroundColor = "#FFE5D6"
orangeTextColor = "#8A2E06"
violetColor = "#5B3FD9"
violetBackgroundColor = "#E8E2FF"
violetTextColor = "#3B248F"
grayColor = "#5B5E70"
grayBackgroundColor = "#E4DCCA"
grayTextColor = "#4A4D5E"

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/bricolage-grotesque-latin-var.woff2"
weight = "200 800"

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/instrument-sans-latin-var.woff2"
weight = "400 700"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-400-normal.woff2"
weight = 400

[theme.sidebar]
backgroundColor = "#0A0C1B"
secondaryBackgroundColor = "#1A1D33"
textColor = "#F4EEE1"
borderColor = "#3A3E5C"
primaryColor = "#D4FF3A"
linkColor = "#D4FF3A"
